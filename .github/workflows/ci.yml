# push / PR のたびにオフラインテスト一式を回す（APIキー不要のテストのみ）
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  # iOSアプリを実際にビルドしてテストする。
  # 署名は要らない（シミュレータ向けビルドのため）ので、
  # Apple Developer Program に入っていなくても通る。
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: Xcode プロジェクトを生成
        working-directory: ios
        run: xcodegen generate

      - name: 使えるシミュレータを選ぶ
        id: sim
        # ランナーのイメージが変わっても壊れないよう、実在する端末から拾う
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in devices[runtime]:
                  if 'iPhone' in d['name']:
                      print(d['name'])
                      raise SystemExit
          ")
          echo "選択: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: ビルドとテスト
        working-directory: ios
        run: |
          xcodebuild test \
            -project TabiMate.xcodeproj \
            -scheme TabiMate \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # pytest は開発用のためrequirements.txtに含めていない（ここで追加インストール）
        run: pip install -r requirements.txt pytest

      - name: Run tests (offline, smoke除外)
        env:
          GOOGLE_API_KEY: dummy
          TAVILY_API_KEY: dummy
          SECRET_KEY: dummy
        run: pytest tests/ -q -k "not smoke"

      - name: JS syntax check
        run: |
          for f in src/static/js/*.js; do node --check "$f"; done

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: iOS ロジックの型検査とテスト
        # SwiftUI 側は Apple の SDK が要るので回せないが、モデル・通信・地図の
        # 並び順は Foundation だけなので Linux で本物のコンパイラに通せる
        run: scripts/check_ios_logic.sh

      - name: Templates compile check
        env:
          GOOGLE_API_KEY: dummy
          TAVILY_API_KEY: dummy
          SECRET_KEY: dummy
        working-directory: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from app import app
          for t in Path("templates").rglob("*.html"):
              app.jinja_env.get_template(str(t.relative_to("templates")))
          print("all templates OK")
          PY
