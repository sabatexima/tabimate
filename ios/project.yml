# XcodeGen 用のプロジェクト定義。
# `brew install xcodegen && cd ios && xcodegen generate` で TabiMate.xcodeproj ができる。
# Xcode で手作業で作る場合は README.md の「手で作る場合」を参照。
#
# ★ 使う前に Config.xcconfig の3行を自分の値に書き換えること。
name: TabiMate
options:
  bundleIdPrefix: app.tabimate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    # 言語モード。指定できるのは 4.0 / 4.2 / 5.0 / 6.0 だけ（"5.9" のような
    # コンパイラのバージョンを書くとビルドが通らない）。
    # コードは Swift 6 の厳格な並行性チェックも通るように書いてあるので、
    # "6.0" に上げても構わない。
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: ja
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  TabiMate:
    type: application
    platform: iOS
    sources:
      - path: TabiMate
        # 置き場の説明書きはアプリに同梱しない
        excludes:
          - "Resources/README.md"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: TabiMate/Resources/Info.plist
      properties:
        CFBundleDisplayName: たびメイト
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # サーバーの場所。Config.xcconfig の TABIMATE_BASE_URL が入る
        TabiMateBaseURL: $(TABIMATE_BASE_URL)
        # Google サインインの iOS クライアントID
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        # サインイン後にアプリへ戻ってくるための URL スキーム
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_IOS_URL_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tabimate.ios
        TARGETED_DEVICE_FAMILY: "1"
        # 自分たちのコードだけ厳しくする（依存ライブラリには波及させない）。
        # 並行性の取り違えは、動かしてみるまで気づけない種類の不具合になるため。
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  TabiMateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TabiMateTests
    dependencies:
      - target: TabiMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tabimate.ios.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  TabiMate:
    build:
      targets:
        TabiMate: all
        TabiMateTests: [test]
    test:
      targets: [TabiMateTests]
    run:
      config: Debug
