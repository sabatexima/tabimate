<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>home.js の検査</title>
</head>
<body>
<!--
  home.js を本物のブラウザで動かして、画面まわりの振る舞いを確かめる。

  なぜ要るか: このファイルの不具合は「構文は正しいのに実行時に何も起きない」形で出る。
  実際、home.html のインラインスクリプトが home.js の const と同じ名前を var で
  宣言していたため、スクリプト全体が SyntaxError で死んでいて「こんな旅はどう？」の
  チップが無反応になっていた。node --check では見つけられない種類の壊れ方。

  使い方: scripts/check_home_js.sh （?case=N でひとつずつ動かす）
-->

<!-- home.js が触る要素。home.html と同じ id をそろえる -->
<div id="chat-box"></div>
<div id="typing" style="display:none">
  <span id="thinking-text"></span>
</div>
<form id="message-form">
  <input type="text" id="message-input">
  <button type="submit" id="send-button"></button>
  <button type="button" id="stop-button" style="display:none"></button>
</form>
<button id="new-chat-btn"></button>

<pre id="result">（実行中）</pre>

<script>
  // ---- 本物の代わり ----------------------------------------------------
  window.marked = { parse: (s) => s };
  window.DOMPurify = { sanitize: (s) => s };

  const CASE = new URLSearchParams(location.search).get('case');
  const calls = [];          // どのURLを叩いたか
  let confirmAnswer = true;  // confirm の返事
  window.confirm = () => confirmAnswer;

  // 応答の決め方はケースごとに変える
  const state = { messages: [], resetOk: true };

  window.fetch = async (url, options) => {
    const method = (options && options.method) || 'GET';
    calls.push(method + ' ' + String(url).split('?')[0]);
    const json = (body, ok = true) => ({
      ok,
      status: ok ? 200 : 500,
      json: async () => body,
      body: { getReader: () => ({ read: async () => ({ done: true }) }) },
    });
    const path = String(url).split('?')[0];
    if (path === '/get_messages') {
      // わざと遅らせる。同時に2つ走ると混ざる類の不具合は、
      // 応答が速いと窓が開かず素通りしてしまう
      await wait(state.messagesDelay || 0);
      return json(state.messages);
    }
    if (path === '/reset_chat') {
      if (state.resetOk) state.messages = [];
      return json({ status: state.resetOk ? 'OK' : 'ERROR' }, state.resetOk);
    }
    if (path === '/generation_status') {
      // セッション切れ（401）を模す。「終わった」と読み違えないことを見る
      if (state.statusFails) return json({ status: 'ERROR' }, false);
      // active はこのインスタンスの記憶。別のインスタンスが動かしていると false になる
      return json({ active: false, state: state.genState || 'gone' });
    }
    if (path === '/abort_request') return json({ status: 'OK' });
    if (path === '/send_message') {
      if (!state.keepStreamOpen) return json({ status: 'OK' });
      // 「まだ作っている最中」を作る。本物と同じく、中断されるまで返事を返さない
      const signal = options && options.signal;
      const res = json({ status: 'OK' });
      res.body = {
        getReader: () => ({
          read: () => new Promise((_, reject) => {
            if (!signal) return;
            signal.addEventListener('abort', () => {
              const err = new Error('aborted');
              err.name = 'AbortError';
              reject(err);
            });
          }),
        }),
      };
      return res;
    }
    return json({});
  };

  // ---- 検査の書き方 ----------------------------------------------------
  const failures = [];
  function check(label, condition, detail) {
    if (!condition) failures.push(label + (detail ? '（' + detail + '）' : ''));
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const bodyCount = () =>
    document.querySelectorAll('#chat-box .message-wrapper:not(.greeting)').length;
  const greetingCount = () =>
    document.querySelectorAll('#chat-box .greeting').length;

  // ケースごとの前準備（home.js を読み込む前に済ませる）
  if (CASE === '1') {
    state.messages = [
      { role: 'user', content: '熱海に行きたい' },
      { role: 'ai', content: '移動手段のご希望はありますか？' },
    ];
  }
  if (CASE === '2' || CASE === '3') {
    state.messages = [{ role: 'user', content: '熱海に行きたい' }];
  }
  if (CASE === '2') state.keepStreamOpen = true;
  if (CASE === '3') state.resetOk = false;

  // 5・6 はリロード直後の復元。生成中に閉じた印（localStorage）を置いておく
  if (CASE === '5' || CASE === '6') {
    state.messages = [
      { role: 'user', content: '熱海に行きたい' },
      { role: 'ai', content: 'プランができました' },
    ];
    state.messagesDelay = 40;
    try {
      localStorage.setItem('tabimate_gen', JSON.stringify({ id: 'r1', msg: '熱海に行きたい' }));
    } catch (e) { /* 使えない環境では 5・6 は意味を成さない */ }
  }
  if (CASE === '6') state.statusFails = true;

  // 8 は報告のあった症状そのもの。リロードしたとき、生成を動かしているのが
  // 別のインスタンスでも「考えています」が出続けること
  if (CASE === '8') {
    state.messages = [{ role: 'user', content: '車' }];
    state.genState = 'pending';
    try {
      localStorage.setItem('tabimate_gen', JSON.stringify({ id: 'r1', msg: '車' }));
    } catch (e) { /* 使えない環境では 8 は意味を成さない */ }
  }

  // 9 は生成が失敗して行ごと消えた場合。案内を出して入力を戻すこと
  if (CASE === '9') {
    state.messages = [{ role: 'user', content: '車' }];
    state.genState = 'gone';
    try {
      localStorage.setItem('tabimate_gen', JSON.stringify({ id: 'r1', msg: '車' }));
    } catch (e) { /* 同上 */ }
  }

  // 10 は控え（localStorage）が失われている場合。履歴の最後がこちらの発言なら、
  // まだ返事待ちだと分かるので、そこから復元できること
  if (CASE === '10') {
    state.messages = [{ role: 'user', content: '車', request_id: 'r9' }];
    state.genState = 'pending';
    try { localStorage.removeItem('tabimate_gen'); } catch (e) { /* noop */ }
  }

  // 7 は「復元中に、こんな旅はどう？から来た」場合。生成が二重に走らないこと
  if (CASE === '7') {
    state.messages = [{ role: 'user', content: '熱海に行きたい' }];
    state.messagesDelay = 40;
    state.genState = 'pending';
    try {
      localStorage.setItem('tabimate_gen', JSON.stringify({ id: 'r1', msg: '熱海に行きたい' }));
    } catch (e) { /* 使えない環境では 7 は意味を成さない */ }
  }
</script>

<script src="../../src/static/js/home.js"></script>

<script>
  (async () => {
    await wait(150);  // 起動時の読み込みが終わるのを待つ

    if (CASE === '1') {
      // 起動: 挨拶ひとつ + 履歴2件。二重に描かれていないこと
      check('挨拶が1つだけ出ること', greetingCount() === 1, greetingCount() + '個');
      check('履歴が2件出ること', bodyCount() === 2, bodyCount() + '件');
    }

    if (CASE === '2') {
      // 生成中に「新しいチャット」を押す
      document.getElementById('message-input').value = 'テスト';
      document.getElementById('message-form')
        .dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      await wait(80);

      calls.length = 0;
      document.getElementById('new-chat-btn').click();
      await wait(200);

      check('走っている生成を止めること', calls.includes('POST /abort_request'), calls.join(' / '));
      check('履歴をリセットすること', calls.includes('POST /reset_chat'));
      check('止めてから消すこと',
        calls.indexOf('POST /abort_request') < calls.indexOf('POST /reset_chat'));
      check('入力欄が使える状態に戻ること',
        document.getElementById('message-input').disabled === false);
      check('停止ボタンが隠れること',
        document.getElementById('stop-button').style.display === 'none');
      check('会話が空になること', bodyCount() === 0, bodyCount() + '件');
      check('挨拶は残ること', greetingCount() === 1);
    }

    if (CASE === '3') {
      // リセットに失敗したら、画面を消さない（サーバーとずれるため）。
      // お知らせが1件増えるので、件数ではなく元の発言が残っているかで見る
      await wait(50);
      document.getElementById('new-chat-btn').click();
      await wait(200);
      const text = document.getElementById('chat-box').textContent;
      check('失敗時は元の発言が残ること', text.includes('熱海に行きたい'));
      check('失敗を知らせること', text.includes('リセットできませんでした'));
      check('入力欄が使える状態に戻ること',
        document.getElementById('message-input').disabled === false);
    }

    if (CASE === '4') {
      // ?q= で来たら、リセットしてからその文を送る
      check('履歴をリセットすること', calls.includes('POST /reset_chat'), calls.join(' / '));
      check('その文を送ること', calls.includes('POST /send_message'));
      check('URL から q を消すこと', !location.search.includes('q='), location.search);
    }

    if (CASE === '5') {
      // リロード直後。履歴の読み込みと復元処理が同時に走っても、二重に描かれないこと
      await wait(400);
      check('挨拶が1つだけ出ること', greetingCount() === 1, greetingCount() + '個');
      check('履歴が2件だけ出ること', bodyCount() === 2, bodyCount() + '件');
      check('終わっている生成に失敗の案内を出さないこと',
        !document.getElementById('chat-box').textContent.includes('終わりませんでした'));
      check('控えを片づけること', localStorage.getItem('tabimate_gen') === null);
    }

    if (CASE === '6') {
      // 生成中かどうかを確かめられなかったとき（セッション切れなど）。
      // 勝手に「失敗しました」と決めつけず、控えも残して次回に任せる
      await wait(400);
      check('決めつけて失敗の案内を出さないこと',
        !document.getElementById('chat-box').textContent.includes('終わりませんでした'));
      check('控えを残すこと', localStorage.getItem('tabimate_gen') !== null);
      check('入力欄が使えること',
        document.getElementById('message-input').disabled === false);
    }

    if (CASE === '7') {
      // 前の生成がまだ走っている最中に新しい相談が始まると、
      // 二重に生成が走って結果が混ざる。始める前に必ず止めること
      await wait(600);
      const abort = calls.indexOf('POST /abort_request');
      const send = calls.indexOf('POST /send_message');
      check('前の生成を止めること', abort !== -1, calls.join(' / '));
      check('新しい相談を送ること', send !== -1);
      check('止めてから送ること', abort !== -1 && send !== -1 && abort < send);
    }

    if (CASE === '8') {
      await wait(400);
      const typing = document.getElementById('typing');
      check('「考えています」が出ていること', typing.style.display === 'flex', typing.style.display);
      check('停止ボタンが出ていること',
        document.getElementById('stop-button').style.display === 'flex');
      check('入力欄が塞がれていること',
        document.getElementById('message-input').disabled === true);
      check('失敗の案内を出さないこと',
        !document.getElementById('chat-box').textContent.includes('終わりませんでした'));
    }

    if (CASE === '9') {
      await wait(400);
      const text = document.getElementById('chat-box').textContent;
      check('失敗を伝えること', text.includes('終わりませんでした'), text.slice(0, 60));
      check('入力欄に文を戻すこと',
        document.getElementById('message-input').value === '車',
        document.getElementById('message-input').value);
      check('「考えています」を消すこと',
        document.getElementById('typing').style.display === 'none');
    }

    if (CASE === '10') {
      await wait(400);
      const typing = document.getElementById('typing');
      check('控えが無くても「考えています」が出ること',
        typing.style.display === 'flex', typing.style.display);
      check('その回の request_id で問い合わせること',
        calls.includes('GET /generation_status'), calls.join(' / '));
      check('入力欄が塞がれていること',
        document.getElementById('message-input').disabled === true);
    }

    document.getElementById('result').textContent =
      failures.length === 0 ? 'ALL PASS' : 'FAIL: ' + failures.join(' | ');
    document.title = failures.length === 0 ? 'ALL PASS' : 'FAIL';
  })().catch((e) => {
    document.getElementById('result').textContent = 'FAIL: 例外 ' + e;
    document.title = 'FAIL';
  });
</script>
</body>
</html>
